name: katamaran_ground_control
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dart_mavlink: ^0.1.0
  # flutter_map: ^7.0.2
  # flutter_map: ^8.2.1
  latlong2: ^0.9.1
  share_plus: ^10.0.0
  flutter_libserialport: ^0.4.0
  shared_preferences: ^2.5.3
  xml: ^6.5.0
  window_manager: ^0.5.2
  file_picker: ^10.3.2

  # vector_map_tiles: ^8.0.0
  # vector_map_tiles_mbtiles: ^1.2.0
  mbtiles: ^0.4.0
  path: ^1.9.0

  flutter_map: ^7.0.2
  vector_map_tiles: ^8.0.0
  vector_map_tiles_mbtiles: ^1.2.0
  sqlite3: ^2.9.3
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ship.png
    - assets/arrow.png
    - assets/cat.gif
    - assets/parameters/apm.pdef.xml
    - assets/map_style/
    - assets/fonts/
